# Template — docker-compose.base.yml
# Adjust paths/ports/commands to your repo. Avoid `container_name`.
# Tip: keep Postgres/Redis on a `private` (internal) network.
name: ${COMPOSE_PROJECT_NAME:-app}

services:
  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public
      - private
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: ./services/worker/Dockerfile
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # PostgreSQL 18+ keeps data in /var/lib/postgresql/<major>/docker; mount the parent. An EXISTING volume is not retargeted by this edit (moving its data is a migration).
      - postgres_data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  public: {}
  private:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
